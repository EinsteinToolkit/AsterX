# Option list for the Einstein Toolkit

# The "weird" options here should probably be made the default in the
# ET instead of being set here.

# The lwji/carpetx container this option list targets provides MPI, HDF5 and
# PETSc through the **MPI ABI** in /usr/local, not through distribution
# packages. The images are built from CarpetX's `docker/carpetx-*.dockerfile`;
# CarpetX's `scripts/actions-*.cfg` carry the same settings and explain each
# one in detail.
#
# - MPI_INC_DIRS / MPI_LIB_DIRS / MPI_LIBS are set explicitly so that
#   ExternalLibraries/MPI takes its manual path: the wrapper's `-compile_info`
#   reports no `-L`/`-l` flags, so the automatic path would link nothing.
# - HDF5 is the CMake build, which spells its Fortran libraries differently
#   from Debian and adds the `*_f90cstub` pair.
# - PETSc is a single `libpetsc.so`, so PETSC_LIBS is left unset.
# - F90FLAGS gains -I/usr/local/include: gfortran does not search it for `.mod`
#   files.

# Whenever this version string changes, the application is configured
# and rebuilt from scratch
VERSION = actions-real-cpu64-2026-10-02

CPP = cpp
CC = gcc
CXX = g++
FPP = cpp
FC = gfortran
F90 = gfortran

CFLAGS = -pipe -g -std=gnu11
CXXFLAGS = -pipe -g -std=gnu++20
FPPFLAGS = -traditional
F90FLAGS = -pipe -g -fcray-pointer -ffixed-line-length-none -I/usr/local/include

C_LINE_DIRECTIVES = yes
F_LINE_DIRECTIVES = yes

INTEGER_PRECISION = 4
REAL_PRECISION = 8

DEBUG = no
# -fsanitize=address
CPP_DEBUG_FLAGS = -DCARPET_DEBUG
C_DEBUG_FLAGS = -fbounds-check -fsanitize=undefined -fstack-protector-all -ftrapv
CXX_DEBUG_FLAGS = -fbounds-check -fsanitize=undefined -fstack-protector-all -ftrapv
FPP_DEBUG_FLAGS = -DCARPET_DEBUG
F90_DEBUG_FLAGS = -fcheck=bounds,do,mem,pointer,recursion -finit-character=65 -finit-integer=42424242 -finit-real=nan -fsanitize=undefined -fstack-protector-all -ftrapv

OPTIMISE = yes
C_OPTIMISE_FLAGS = -O3 -fcx-limited-range -fexcess-precision=fast -ffp-contract=fast -fno-math-errno -fno-rounding-math -fno-signaling-nans -funsafe-math-optimizations
CXX_OPTIMISE_FLAGS = -O3 -fcx-limited-range -fexcess-precision=fast -ffp-contract=fast -fno-math-errno -fno-rounding-math -fno-signaling-nans -funsafe-math-optimizations
F90_OPTIMISE_FLAGS = -O3 -fcx-limited-range -fexcess-precision=fast -ffp-contract=fast -fno-math-errno -fno-rounding-math -fno-signaling-nans -funsafe-math-optimizations

OPENMP = yes
CPP_OPENMP_FLAGS = -fopenmp
FPP_OPENMP_FLAGS = -D_OPENMP
C_OPENMP_FLAGS   = -fopenmp
CXX_OPENMP_FLAGS = -fopenmp
F90_OPENMP_FLAGS = -fopenmp
LD_OPENMP_FLAGS = -fopenmp

# -fanalyzer: finds only possible null dereferences in std::vector
WARN = yes
CPP_WARN_FLAGS = -Wall
C_WARN_FLAGS =
CXX_WARN_FLAGS =
FPP_WARN_FLAGS = -Wall
F90_WARN_FLAGS = -Wall -Wshadow -Wsurprising

ADIOS2_DIR = /usr/local
ADIOS2_LIBS = adios2_cxx_mpi adios2_cxx
AMREX_DIR = /usr/local
# ASDF_CXX_DIR = /usr/local
BLAS_DIR = /usr
BOOST_DIR = /usr
# Boost.System is header-only since Boost 1.69 and the image does not ship it;
# without this, ExternalLibraries/Boost would link -lboost_system.
BOOST_LIBS = boost_filesystem
FFTW3_DIR = /usr
GSL_DIR = /usr
HDF5_DIR = /usr/local
HDF5_ENABLE_CXX = yes
HDF5_ENABLE_FORTRAN = yes
HDF5_INC_DIRS = /usr/local/include
HDF5_LIB_DIRS = /usr/local/lib
HDF5_LIBS = hdf5_hl_cpp hdf5_cpp hdf5_hl_fortran hdf5_fortran hdf5_hl_f90cstub hdf5_f90cstub hdf5_hl hdf5
HWLOC_DIR = /usr
# JEMALLOC_DIR = /usr/local
LAPACK_DIR = /usr
# LIBJPEG_DIR = /usr
# LORENE_DIR = /usr/local
MPI_DIR = /usr/local
MPI_INC_DIRS = /usr/local/include
MPI_LIB_DIRS = /usr/local/lib
MPI_LIBS = mpif mpi_abi
NSIMD_DIR = /usr/local
NSIMD_SIMD = AVX2
OPENBLAS_DIR = /usr
OPENPMD_API_DIR = /usr/local
# OPENSSL_DIR = /usr
# PAPI_DIR = /usr/local
PETSC_DIR = /usr/local
PETSC_ARCH_LIBS = m
PTHREADS_DIR = NO_BUILD
# REPRIMAND_DIR = /usr/local
# REPRIMAND_LIBS = RePrimAnd
# RNPLETAL_DIR = /usr/local
SILO_DIR = /usr/local
# SIMULATIONIO_DIR = /usr/local
# SSHT_DIR = /usr/local
YAML_CPP_DIR = /usr/local
ZLIB_DIR = /usr
